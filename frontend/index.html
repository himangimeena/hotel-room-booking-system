<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Haven – Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ════════════════════════════════════════════
     LOGIN PAGE
     API used: POST /auth/login
     On success → saves token + user, redirects
     Admin  → admin-dashboard.html
     Customer → rooms.html
════════════════════════════════════════════ -->

<div class="auth-page">
  <div class="auth-card">

    <!-- Logo icon -->
    <div class="auth-icon">⚜</div>

    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">The Sanctuary Awaits</p>

    <!-- Error / success message box -->
    <div id="msg" class="alert"></div>

    <!-- Email field -->
    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input
        class="form-control"
        type="email"
        id="email"
        placeholder="your@email.com"
        autocomplete="email"
      />
    </div>

    <!-- Password field -->
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input
        class="form-control"
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />
    </div>

    <!-- Submit -->
    <button class="btn btn-gold btn-full" id="login-btn" onclick="doLogin()">
      SIGN IN
    </button>

    <hr class="auth-divider" />

    <!-- Link to register -->
    <p class="auth-footer-text">
      Not a member?&nbsp;<a href="register.html">Create Account</a>
    </p>

  </div>
</div>

<!-- api.js must come first -->
<script src="js/api.js"></script>
<script>

  // ── Auto-redirect if already logged in ──────────
  (function () {
    const user = getUser();
    if (user && getToken()) {
      window.location.href =
        user.role === 'admin' ? 'admin-dashboard.html' : 'rooms.html';
    }
  })();

  // ── Login handler ────────────────────────────────
  async function doLogin() {
    hideAlert('msg');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');

    // Basic validation
    if (!email || !password) {
      return showAlert('msg', 'Please enter your email and password.');
    }

    // Disable button to prevent double-click
    btn.disabled    = true;
    btn.textContent = 'Signing in…';

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });

      // Save token and user info in browser storage
      saveSession(data.token, data.user);

      // Redirect based on user role
      window.location.href =
        data.user.role === 'admin' ? 'admin-dashboard.html' : 'rooms.html';

    } catch (err) {
      showAlert('msg', err.message);
      btn.disabled    = false;
      btn.textContent = 'SIGN IN';
    }
  }

  // Allow pressing Enter to submit
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });

</script>
</body>
</html>
