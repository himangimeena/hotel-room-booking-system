<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Haven – Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align:center; color: #c9a84c; font-size:2rem; margin-bottom:10px;">⚜</div>
            <h2>Welcome Back</h2>
            <p class="subtitle">THE SANCTUARY AWAITS</p>

            <div id="alert-box"></div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="btn-gold-full" onclick="login()">SIGN IN</button>

            <div class="auth-link">
                Not a member? <a href="register.html">Create Account</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
