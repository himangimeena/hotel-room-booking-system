<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Haven – Create Account</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ════════════════════════════════════════════
     REGISTER PAGE
     API used: POST /auth/register
     On success → redirect to login
════════════════════════════════════════════ -->

<div class="auth-page">
  <div class="auth-card">

    <h2 class="auth-title">Create Account</h2>
    <p class="auth-subtitle">Begin Your Journey to Pure Serenity</p>

    <div id="msg" class="alert"></div>

    <!-- Full name -->
    <div class="form-group">
      <label class="form-label" for="name">Full Name</label>
      <input class="form-control" type="text" id="name"
             placeholder="Your full name" autocomplete="name" />
    </div>

    <!-- Email -->
    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input class="form-control" type="email" id="email"
             placeholder="your@email.com" autocomplete="email" />
    </div>

    <!-- Password + Confirm side by side -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password"
               placeholder="Min. 6 chars" />
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm">Confirm</label>
        <input class="form-control" type="password" id="confirm"
               placeholder="Repeat password" />
      </div>
    </div>

    <button class="btn btn-gold btn-full" id="reg-btn" onclick="doRegister()">
      Register &rarr;
    </button>

    <hr class="auth-divider" />

    <p class="auth-footer-text">
      Already have an account?&nbsp;<a href="index.html">Sign In</a>
    </p>

  </div>
</div>

<script src="js/api.js"></script>
<script>

  async function doRegister() {
    hideAlert('msg');

    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const btn      = document.getElementById('reg-btn');

    // Client-side validation
    if (!name || !email || !password || !confirm) {
      return showAlert('msg', 'Please fill in all fields.');
    }
    if (password.length < 6) {
      return showAlert('msg', 'Password must be at least 6 characters.');
    }
    if (password !== confirm) {
      return showAlert('msg', 'Passwords do not match.');
    }

    btn.disabled    = true;
    btn.textContent = 'Creating account…';

    try {
      await apiFetch('/auth/register', {
        method: 'POST',
        body: JSON.stringify({ name, email, password })
      });

      showAlert('msg', '✅ Account created! Redirecting to login…', 'success');
      setTimeout(() => (window.location.href = 'index.html'), 2000);

    } catch (err) {
      showAlert('msg', err.message);
      btn.disabled    = false;
      btn.textContent = 'Register →';
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doRegister();
  });

</script>
</body>
</html>
