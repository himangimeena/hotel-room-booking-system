<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Haven – Create Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="subtitle">Begin your journey to pure serenity.</p>

            <div id="alert-box"></div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Your full name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min. 6 characters">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Repeat password">
            </div>

            <button class="btn-gold-full" onclick="register()">Register →</button>

            <div class="auth-link">
                Already have an account? <a href="index.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
