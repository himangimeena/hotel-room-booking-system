<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Haven – Revenue</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<!-- ════════════════════════════════════════════
     REVENUE PAGE
     API used: GET /revenue
════════════════════════════════════════════ -->

<div class="admin-shell">
  <div id="admin-shell-mount"></div>

  <main class="admin-main">
    <h1 class="admin-page-title">Revenue</h1>
    <p class="admin-page-sub">Financial performance overview</p>

    <div class="report-grid" id="revenue-cards">
      <!-- filled by JS -->
    </div>

    <div class="admin-table-wrap" style="padding:24px;">
      <h3 style="margin-bottom:6px;">Last 7 Days</h3>
      <p class="muted-text" style="font-size:0.82rem; margin-bottom:8px;">Daily revenue from confirmed bookings</p>
      <div class="bar-chart" id="bar-chart">
        <!-- filled by JS -->
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/admin-sidebar.js"></script>
<script>

  requireAdmin();

  async function loadRevenue() {
    const cardsEl = document.getElementById('revenue-cards');
    const chartEl = document.getElementById('bar-chart');
    cardsEl.innerHTML = spinnerHTML();

    try {
      const r = await apiFetch('/revenue');

      const cards = [
        { label: "Today's Revenue",  value: r.today },
        { label: 'Monthly Revenue',  value: r.monthly },
        { label: 'Total Revenue',    value: r.total },
        { label: 'Average Booking Value', value: r.average },
      ];

      cardsEl.innerHTML = cards.map(c => `
        <div class="report-card">
          <div class="rc-label">${c.label}</div>
          <div class="rc-value">₹${Number(c.value).toLocaleString('en-IN')}</div>
        </div>
      `).join('');

      // ── Bar chart for last 7 days ──
      if (!r.last7Days.length) {
        chartEl.innerHTML = `<p class="muted-text">No revenue recorded in the last 7 days.</p>`;
        return;
      }

      const maxVal = Math.max(...r.last7Days.map(d => Number(d.total)), 1);

      // Build a full 7-day range (fills in missing days with 0)
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const iso = d.toISOString().split('T')[0];
        const match = r.last7Days.find(x => x.day.startsWith(iso));
        days.push({
          label: d.toLocaleDateString('en-IN', { weekday: 'short' }),
          value: match ? Number(match.total) : 0
        });
      }

      chartEl.innerHTML = days.map(d => `
        <div class="bar-col">
          <div class="bar" style="height:${Math.max((d.value / maxVal) * 100, 2)}%;" title="₹${d.value.toLocaleString('en-IN')}"></div>
          <div class="bar-label">${d.label}</div>
        </div>
      `).join('');

    } catch (err) {
      cardsEl.innerHTML = `<p style="color:var(--danger);">Error: ${err.message}</p>`;
    }
  }

  loadRevenue();

</script>
</body>
</html>
