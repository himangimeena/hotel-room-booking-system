<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Haven – Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <span class="logo">AZURE HAVEN</span>
        <div class="nav-links">
            <span style="color: var(--gray); font-size:0.85rem;">ADMINISTRATOR</span>
            <a href="#" onclick="logout()" style="margin-left:20px;">Logout</a>
        </div>
    </nav>

    <div style="padding: 40px 30px; max-width: 1100px; margin: 0 auto;">
        <h1 style="color: var(--gold); letter-spacing: 4px; text-align:center; margin-bottom: 30px;">
            ADMIN PANEL
        </h1>

        <!-- Stats Row -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
            <div style="background: var(--card-bg); border-radius:12px; padding:30px; border:1px solid rgba(201,168,76,0.2);">
                <p style="color:var(--gray); font-size:0.75rem; letter-spacing:2px;">INVENTORY</p>
                <p style="font-size:2rem; font-weight:bold;" id="total-rooms">Loading...</p>
                <p style="color:var(--gray);">Total Rooms</p>
            </div>
            <div style="background: var(--card-bg); border-radius:12px; padding:30px; border:1px solid rgba(201,168,76,0.2);">
                <p style="color:var(--gray); font-size:0.75rem; letter-spacing:2px;">ACTIVITY</p>
                <p style="font-size:2rem; font-weight:bold;" id="total-bookings">Loading...</p>
                <p style="color:var(--gray);">Total Bookings</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap:16px; margin-bottom:30px;">
            <button class="btn-gold" onclick="showAddRoom()" style="padding:20px; border-radius:12px; font-size:0.9rem;">
                🏠 ADD ROOM
            </button>
            <button class="btn-gold" onclick="showEditRoom()" style="padding:20px; border-radius:12px; font-size:0.9rem;">
                ✏️ EDIT ROOM
            </button>
            <button class="btn-gold" onclick="showDeleteRoom()" style="padding:20px; border-radius:12px; font-size:0.9rem;">
                🗑️ DELETE ROOM
            </button>
        </div>

        <!-- Add Room Form (hidden by default) -->
        <div id="add-room-form" style="display:none; background:var(--card-bg); border-radius:12px; 
             padding:24px; margin-bottom:20px; border:1px solid rgba(201,168,76,0.3);">
            <h3 style="color:var(--gold); margin-bottom:16px;">Add New Room</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div class="form-group">
                    <label>Room Number</label>
                    <input type="text" id="new-room-number" placeholder="e.g. 106">
                </div>
                <div class="form-group">
                    <label>Room Type</label>
                    <input type="text" id="new-room-type" placeholder="e.g. Deluxe Suite">
                </div>
                <div class="form-group">
                    <label>Price per Night (₹)</label>
                    <input type="number" id="new-room-price" placeholder="e.g. 4500">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="new-room-desc" placeholder="Short description">
                </div>
            </div>
            <div id="add-room-alert"></div>
            <button class="btn-gold-full" onclick="addRoom()" style="max-width:200px;">Add Room</button>
        </div>

        <!-- Bookings List -->
        <div style="background:var(--card-bg); border-radius:12px; padding:24px; border:1px solid rgba(201,168,76,0.2);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>Bookings List</h3>
                <span style="color:var(--gold); font-size:0.8rem; letter-spacing:1px;">ACTIVE RECORDS</span>
            </div>
            <div id="all-bookings-list">Loading bookings...</div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
