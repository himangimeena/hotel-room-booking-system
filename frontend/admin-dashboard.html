<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Haven – Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<!-- ════════════════════════════════════════════
     ADMIN DASHBOARD
     API used: GET /bookings/stats
════════════════════════════════════════════ -->

<div class="admin-shell">
  <div id="admin-shell-mount"></div>

  <main class="admin-main">
    <h1 class="admin-page-title">Dashboard</h1>
    <p class="admin-page-sub">Live overview of Azure Haven's operations</p>

    <!-- 7 metric cards -->
    <div class="metrics-grid" id="metrics-grid">
      <!-- filled by JS -->
    </div>

    <!-- admin-dashboard.html — replace the admin-table-wrap div at the bottom with: -->
<div style="display:flex; justify-content:space-between; align-items:center; margin-top:28px;">
  <p class="muted-text" style="font-size:0.85rem;">
    💡 Data refreshes each time you visit. Click refresh to update now.
  </p>
  <button class="btn btn-outline btn-sm" onclick="loadStats()">↻ Refresh</button>
</div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/admin-sidebar.js"></script>
<script>

  requireAdmin();

  async function loadStats() {
    const grid = document.getElementById('metrics-grid');
    grid.innerHTML = spinnerHTML();

    try {
      const s = await apiFetch('/bookings/stats');

      const cards = [
        { label: 'Total Rooms',        value: s.totalRooms,    icon: '🏨' },
        { label: 'Total Bookings',     value: s.totalBookings, icon: '📋' },
        { label: 'Available Rooms',    value: s.availableRooms, icon: '✅' },
        { label: 'Occupied Rooms',     value: s.occupiedRooms, icon: '🛏' },
        { label: "Today's Check-ins",  value: s.todayCheckIns, icon: '➡️' },
        { label: "Today's Check-outs", value: s.todayCheckOuts, icon: '⬅️' },
        { label: 'Revenue (this month)', value: `₹${Number(s.monthlyRevenue).toLocaleString('en-IN')}`, icon: '💰', accent: true },
      ];

      grid.innerHTML = cards.map(c => `
        <div class="metric-card ${c.accent ? 'accent' : ''}">
          <div class="metric-icon">${c.icon}</div>
          <div class="metric-label">${c.label}</div>
          <div class="metric-value">${c.value}</div>
        </div>
      `).join('');

    } catch (err) {
      grid.innerHTML = `<p style="color:var(--danger);">Could not load dashboard: ${err.message}</p>`;
    }
  }

  loadStats();

</script>
</body>
</html>
