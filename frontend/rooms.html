<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Haven – Available Rooms</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="rooms.html" class="logo">AZURE HAVEN</a>
        <div class="nav-links">
            <a href="rooms.html">Rooms</a>
            <a href="my-bookings.html">My Stay</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div style="padding: 40px 30px; max-width: 900px; margin: 0 auto;">
        <h1 style="color: var(--gold); letter-spacing: 4px; margin-bottom: 30px; text-align:center;">
            AVAILABLE ROOMS
        </h1>

        <!-- Booking Modal -->
        <div id="booking-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
             background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
            <div style="background: var(--card-bg); border: 1px solid var(--gold); border-radius:16px; 
                        padding: 30px; width: 90%; max-width: 400px;">
                <h3 style="color:var(--gold); margin-bottom:20px;">Book Room <span id="modal-room-name"></span></h3>
                <div class="form-group">
                    <label>Check-In Date</label>
                    <input type="date" id="check-in" style="width:100%; padding:12px; background:rgba(255,255,255,0.08); 
                           border:1px solid rgba(201,168,76,0.3); border-radius:8px; color:white;">
                </div>
                <div class="form-group">
                    <label>Check-Out Date</label>
                    <input type="date" id="check-out" style="width:100%; padding:12px; background:rgba(255,255,255,0.08); 
                           border:1px solid rgba(201,168,76,0.3); border-radius:8px; color:white;">
                </div>
                <div id="booking-alert"></div>
                <div style="display:flex; gap:12px; margin-top:16px;">
                    <button class="btn-gold-full" onclick="confirmBooking()">Confirm Booking</button>
                    <button onclick="closeModal()" style="flex:1; padding:14px; background:transparent; 
                            border:1px solid var(--gray); color:var(--gray); border-radius:8px; cursor:pointer;">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <div id="rooms-list">
            <p style="color: var(--gray); text-align:center;">Loading rooms...</p>
        </div>
    </div>

    <script src="js/rooms.js"></script>
</body>
</html>
