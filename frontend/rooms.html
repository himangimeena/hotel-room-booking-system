<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Haven – Available Rooms</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ════════════════════════════════════════════
     ROOMS PAGE (Customer)
     APIs used:
       GET  /rooms               → list all rooms
       POST /bookings            → create booking
════════════════════════════════════════════ -->

<!-- ── NAVBAR ────────────────────────────────── -->
<nav class="navbar">
  <a class="navbar-logo" href="rooms.html">AZURE HAVEN</a>

  <!-- Desktop nav links -->
  <div class="navbar-links">
    <a href="rooms.html" class="active">Rooms</a>
    <a href="my-bookings.html">My Stay</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>

  <!-- Mobile hamburger -->
  <button class="hamburger" id="ham" onclick="toggleMenu()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- Mobile nav drawer -->
<div class="mobile-nav" id="mobile-nav">
  <a href="rooms.html" onclick="closeMenu()">🏠 Rooms</a>
  <a href="my-bookings.html" onclick="closeMenu()">🛏 My Stay</a>
  <a href="#" onclick="logout()">🚪 Logout</a>
</div>

<!-- ── BOOKING MODAL ──────────────────────────── -->
<div class="modal-overlay" id="booking-modal">
  <div class="modal-box">
    <h3 class="modal-title">Book Room <span id="modal-room-name"></span></h3>

    <div id="modal-msg" class="alert"></div>

    <div class="form-group">
      <label class="form-label" for="check-in">Check-In Date</label>
      <input class="form-control" type="date" id="check-in" />
    </div>

    <div class="form-group">
      <label class="form-label" for="check-out">Check-Out Date</label>
      <input class="form-control" type="date" id="check-out" />
    </div>

    <div class="modal-actions">
      <button class="btn btn-gold" onclick="confirmBooking()">Confirm Booking</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- ── MAIN CONTENT ───────────────────────────── -->
<main class="page-wrap">
  <div class="page-header text-center">
    <h1 class="page-title gold-text uppercase-wide">Available Rooms</h1>
    <p class="muted-text">Select a room to begin your stay at Azure Haven</p>
  </div>

  <!-- Room list renders here -->
  <div id="rooms-list"></div>
</main>

<footer class="footer">
  &copy; 2024 Azure Haven Resort &amp; Spa — All rights reserved
</footer>

<!-- rooms.html — ADD this BEFORE the closing </body> tag -->
<!-- Must load room-images.js so getRoomImage() is available -->
<script src="js/api.js"></script>
<script src="js/room-images.js"></script>  <!-- ← ADD THIS LINE -->
<script>

  requireLogin();
  let selectedRoomId = null;

  const toggleMenu = () => document.getElementById('mobile-nav').classList.toggle('open');
  const closeMenu  = () => document.getElementById('mobile-nav').classList.remove('open');

  async function loadRooms() {
    const list = document.getElementById('rooms-list');
    list.innerHTML = spinnerHTML();

    try {
      const rooms = await apiFetch('/rooms');

      if (!rooms.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🏨</div>
            <p>No rooms available right now.</p>
          </div>`;
        return;
      }

      // ── STATUS BADGE: only show "Occupied" badge; don't show available rooms
      //    that are occupied (backend already filters maintenance rooms out)
      list.innerHTML = rooms.map(room => `
        <div class="room-card">

          <!-- FIXED: real image instead of emoji badge -->
          <div class="room-card-img-wrap">
            <img
              class="room-card-img"
              src="${getRoomImage(room.room_type)}"
              alt="${room.room_type}"
              onerror="this.src='images/rooms/single-room.jpg'"
            />
            ${room.status === 'occupied'
              ? `<span class="room-img-badge occupied-badge">Occupied</span>`
              : `<span class="room-img-badge available-badge">Available</span>`
            }
          </div>

          <div class="room-card-body">
            <h3>Room ${room.room_number}</h3>
            <p class="room-type-label">${room.room_type}</p>
            ${room.description
              ? `<p class="room-card-desc">${room.description}</p>`
              : ''}
          </div>

          <div class="room-card-right">
            <span class="room-price">
              ₹${Number(room.price).toLocaleString('en-IN')}
              <small>/night</small>
            </span>
            <button
              class="btn btn-gold btn-sm"
              ${room.status === 'occupied' ? 'disabled title="Currently occupied"' : ''}
              onclick="${room.status !== 'occupied'
                ? `openModal(${room.id}, '${room.room_number}')`
                : 'void(0)'}">
              ${room.status === 'occupied' ? 'Unavailable' : 'Book Now'}
            </button>
          </div>

        </div>
      `).join('');

    } catch (err) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">⚠️</div>
          <p style="color:#ef4444;">Could not load rooms.<br>
             <small>${err.message}</small></p>
        </div>`;
    }
  }

  // ── Modal helpers (unchanged) ─────────────────────────────
  function openModal(roomId, roomName) {
    selectedRoomId = roomId;
    document.getElementById('modal-room-name').textContent = roomName;
    document.getElementById('check-in').value  = '';
    document.getElementById('check-out').value = '';
    document.getElementById('check-in').min    = todayISO();
    document.getElementById('check-out').min   = todayISO();
    hideAlert('modal-msg');
    document.getElementById('booking-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('booking-modal').classList.remove('open');
    selectedRoomId = null;
  }

  document.getElementById('booking-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  async function confirmBooking() {
    hideAlert('modal-msg');
    const checkIn  = document.getElementById('check-in').value;
    const checkOut = document.getElementById('check-out').value;

    if (!checkIn || !checkOut)
      return showAlert('modal-msg', 'Please select check-in and check-out dates.');
    if (checkOut <= checkIn)
      return showAlert('modal-msg', 'Check-out must be after check-in date.');

    try {
      const data = await apiFetch('/bookings', {
        method: 'POST',
        body: JSON.stringify({ room_id: selectedRoomId, check_in: checkIn, check_out: checkOut })
      });
      showAlert('modal-msg', `✅ ${data.message}`, 'success');
      setTimeout(() => { closeModal(); window.location.href = 'my-bookings.html'; }, 1800);
    } catch (err) {
      showAlert('modal-msg', err.message);
    }
  }

  loadRooms();
</script>
</body>
</html>
